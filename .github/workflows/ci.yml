name: CI

# Runs on every push to main and on every pull request, so a broken change is caught before it is published.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # `npm run build` also type-checks everything (tsc -b) before bundling.
      - name: Type-check and build
        run: npm run build
        env:
          # The build only needs these to exist; no request is made to Supabase while building.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
